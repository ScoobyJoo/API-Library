<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        section {
            margin-bottom: 40px;
        }
        label {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>

<body>
    <header>
        <h1>API Library</h1>
        <p>Welcome to the API Library</p>
    </header>

    <main>
        <section id="login-section">
            <h2>Log In</h2>
            <form id="login-form">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Log In</button>
            </form>
            <p id="login-status"></p>
            <p>No account? <a href="#" id="show-register">Register</a></p>
        </section>

        <section id="register-section" hidden>
            <h2>Register</h2>
            <form id="register-form">
                <div>
                    <label for="reg-first-name">First Name</label>
                    <input type="text" id="reg-first-name" required>
                </div>
                <div>
                    <label for="reg-last-name">Last Name</label>
                    <input type="text" id="reg-last-name" required>
                </div>
                <div>
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div>
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required>
                </div>
                <button type="submit">Register</button>
            </form>
            <p id="register-status"></p>
            <p>Already have an account? <a href="#" id="show-login">Log In</a></p>
        </section>

        <!-- Hidden page until user logs in -->
        <div id="app-content" hidden>
            <section>
                <p id="welcome-message"></p>
                <button type="button" id="logout-btn">Log Out</button>
            </section>

            <section>
                <h2>Search Books</h2>
                <input type="text" id="book-search" placeholder="Search by title or author">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>Available</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="books-table-body"></tbody>
                </table>
            </section>

            <section>
                <h2>My Loans</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Checkout Date</th>
                            <th>Due Date</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="loans-table-body"></tbody>
                </table>
            </section>

            <p id="status"></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 API Library. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='user.js') }}" defer></script>
</body>
</html>
