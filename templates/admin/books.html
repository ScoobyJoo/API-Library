{% extends "admin/layout.html" %}

{% block content %}
<section>
    <h2 id="form-heading">Create a New Book</h2>
    <form id="add-book-form">
        <input type="hidden" id="book-id" value="">
        <div>
            <label for="title">Title</label>
            <input type="text" id="title" required>
        </div>
        <div>
            <label for="author">Author</label>
            <input type="text" id="author" required>
        </div>
        <div>
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" required>
        </div>
        <div>
            <label for="category">Category</label>
            <select id="category" required></select>
        </div>
        <div>
            <label for="total_copies">Total Copies</label>
            <input type="number" id="total_copies" min="0" value="1">
        </div>
        <div>
            <label for="published_year">Published Year</label>
            <input type="number" id="published_year">
        </div>
        <button type="submit" id="form-submit-btn">Add Book</button>
        <button type="button" id="cancel-edit-btn" style="display: none;">Cancel</button>
    </form>
    <p id="add-book-status"></p>
</section>

<section>
    <h2>Books</h2>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Category</th>
                <th>Total</th>
                <th>Available</th>
                <th>Published</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="books-table-body"></tbody>
    </table>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='admin/books.js') }}" defer></script>
{% endblock %}
