{% extends "admin/layout.html" %}

{% block content %}
<section>
    <h2 id="form-heading">Create a New Customer</h2>
    <form id="add-customer-form">
        <input type="hidden" id="customer-id" value="">
        <div>
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" required>
        </div>
        <div>
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" required>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>
        <div>
            <label for="phone">Phone</label>
            <input type="text" id="phone">
        </div>
        <div>
            <label for="membership_date">Membership Date</label>
            <input type="date" id="membership_date">
        </div>
        <button type="submit" id="form-submit-btn">Add Customer</button>
        <button type="button" id="cancel-edit-btn" style="display: none;">Cancel</button>
    </form>
    <p id="customer-status"></p>
</section>

<section>
    <h2>Customers</h2>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Membership Date</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="customers-table-body"></tbody>
    </table>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='admin/customers.js') }}" defer></script>
{% endblock %}
