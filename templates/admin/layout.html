<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Library Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #34495e;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
        }

        nav a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            background-color: #2c3e50;
        }

        nav a.active {
            background-color: #2c3e50;
            font-weight: bold;
        }

        main {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        section {
            margin-bottom: 40px;
        }

        form div {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>API Library</h1>
        <p>Welcome to the Admin Panel</p>
    </header>

    <nav>
        <ul>
            <li><a href="{{ url_for('admin_books') }}" class="{{ 'active' if active_page == 'books' else '' }}">Books</a></li>
            <li><a href="{{ url_for('admin_customers') }}" class="{{ 'active' if active_page == 'customers' else '' }}">Customers</a></li>
            <li><a href="{{ url_for('admin_categories') }}" class="{{ 'active' if active_page == 'categories' else '' }}">Categories</a></li>
            <li><a href="{{ url_for('admin_loans') }}" class="{{ 'active' if active_page == 'loans' else '' }}">Loans</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 API Library. All rights reserved.</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
