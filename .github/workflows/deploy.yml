name: Deploy

# Only deploys from main - pushes to beta or any other branch don't
# trigger this. Requires two GitHub Secrets to be set first (see
# DEPLOYMENT.md): EC2_SSH_PRIVATE_KEY and EC2_HOST.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gates this job on the "production" GitHub Environment (Settings ->
    # Environments in the repo), which has a required-reviewer rule
    # attached. That environment has to be created by hand first - this
    # line alone does nothing until it exists. See DEPLOYMENT.md.
    environment: production
    steps:
      - uses: actions/checkout@v4   # mostly for a readable log entry - the actual
                                     # deploy pulls fresh code on the server itself, below

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/API-Library
            git pull
            docker compose -f docker-compose.prod.yml up -d --build
