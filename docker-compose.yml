
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      # ${VAR:-default} falls back to "postgres" if no .env file sets
      # POSTGRES_PASSWORD, so local `docker compose up` keeps working out
      # of the box with no setup. This file (and this local-only db
      # service) is local dev only now - production runs
      # docker-compose.prod.yml instead, which has no db service at all
      # since it uses AWS RDS (see terraform/rds.tf).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: library
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/library}
      SECRET_KEY: ${SECRET_KEY:-}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    # init_db.py creates tables (idempotent) before the server starts.
    command: >
      sh -c "python init_db.py && python -m flask --app wsgi run --host=0.0.0.0 --port=5000"

volumes:
  pgdata:
